site_name: tingle
site_url: https://tingle.fancysnake.dev
site_description: Code metrics for the era of constant refactoring.
repo_url: https://github.com/fancysnake/tingle
repo_name: fancysnake/tingle
edit_uri: edit/main/docs/
copyright: MIT

# A link to a page that is not there is what rots first when a page is
# renamed, and from here it fails `site:dev` as well as `site:build`.
strict: true

# Under strict a warning is a failure; anchors are how cross-references
# between pages actually break, and MkDocs only logs them at info.
validation:
  anchors: warn
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  # Material's own two schemes, recoloured in stylesheets/tingle.css: its
  # named colours cannot express a three-colour palette, and `custom` keeps
  # its per-colour rules from outranking ours on specificity
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/spider-web, name: Go on night patrol}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Back to daylight}
  features:
    - content.code.copy
    - navigation.top
    - navigation.sections
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fancysnake/tingle
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/tingle/
    - icon: fontawesome/solid/globe
      link: https://fancysnake.dev
      name: fancysnake.dev

extra_css:
  - stylesheets/tingle.css

markdown_extensions:
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - pymdownx.keys
  # Shared prose lives in README.md and CHANGELOG.md and is included from
  # there, so the two cannot drift. base_path is the repo root, which is
  # where mkdocs runs.
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

nav:
  - index.md
  - Guide:
      - configuration.md
      - metrics.md
      - library.md
      - diff.md
      - check.md
      - history.md
      - claude-plugin.md
  - Reference:
      - cli.md
      - changelog.md
  - contributing.md
