# What `vekna cast <ritual>` runs here: cabinet's pull request maintenance
# rituals (heal, ci, review, answer, guide, labels), read from the `[cabinet]`
# section. Only what differs from cabinet's defaults; everything else follows
# the tome, so a cabinet bump is not silently frozen out by a copied value.
[rituals]
modules = ["cabinet.rituals"]

[cabinet]
# A cast has no terminal to answer a prompt on, so neither the push nor the
# commit may ask for one: `origin` is ssh and would want a key passphrase, so
# pushes go through a second remote that is https with `gh` behind it, and
# signing stays off for a contributor whose global `commit.gpgsign` is on and
# whose key has a passphrase. docs/contributing.md carries the two commands a
# fresh clone runs.
remote = "https-origin"
sign_commits = false
# `mise run gate` is the sweep that changes no file and measures no coverage —
# see the task in mise.toml. `coverage` is named because cabinet's default is
# `mise run diff-cover`, which is not a task here; the suite is seconds long,
# so the full measurement and the fast one are the same.
gate = "mise run gate"
coverage = "mise run test:py:cov:diff"

# Job names in .github/workflows/ci.yml, matched by prefix, plus what Codecov
# posts: `tests` covers the interpreter matrix. Each `gate` is the task that
# reproduces the job here; `quality` has no single task, so the whole sweep
# stands in for it. `tingle` is left out on purpose — it is continue-on-error
# and never turns the board red.
[cabinet.ci.jobs.quality]
gate = "mise run gate"

[cabinet.ci.jobs.tests]
gate = "mise run test:py"

[cabinet.ci.jobs."codecov/patch"]
covering = true

# The gate and the coverage tasks are the ritual's to run already; this adds
# the commit sweep, which reformats files an agent did not touch.
[cabinet.agent]
may_not_run = ["mise run fullcheck"]
