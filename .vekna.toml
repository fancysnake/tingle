# What `vekna cast <ritual>` runs here: cabinet's pull request maintenance
# rituals (refresh, cover, review, labels), read from the `[cabinet]` section.
# Only what differs from cabinet's defaults; everything else follows the tome,
# so a cabinet bump is not silently frozen out by a copied value.
[rituals]
modules = ["cabinet.rituals"]

[cabinet]
# `origin` is ssh and a cast has no terminal for ssh to ask a passphrase on, so
# cabinet pushes through a second remote that is https with `gh` behind it. A
# fresh clone makes it once:
#   git remote add https-origin https://github.com/fancysnake/tingle.git
#   gh auth setup-git
remote = "https-origin"
sign_commits = false
# The commit gate, `tingle check` included: a branch that takes on debt is red
# here even though the CI job for it is advisory. `coverage` is named because
# cabinet's default is `mise run diff-cover`, which is not a task here; the
# suite is seconds long, so the full measurement and the fast one are the same.
gate = "mise run fullcheck"
coverage = "mise run test:py:cov:diff"

# Job names in .github/workflows/ci.yml, matched by prefix: `tests` covers the
# interpreter matrix. `tingle` is left out on purpose — it is continue-on-error
# and never turns the board red.
[cabinet.ci]
gate_checks = ["quality", "tests"]

# A single test file or case is a quick check; the linters and the sweeps stay
# the ritual's.
[cabinet.agent]
may_run = ["mise run test:unit", "mise run test:int"]
