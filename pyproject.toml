[project]
name = "tingle"
version = "0.4.0"
description = "Constant refactoring monitoring tool"
authors = [{ name = "Radosław Ganczarek", email = "radoslaw@ganczarek.in" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["metrics", "refactoring", "technical-debt", "code-quality", "linting", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer (>=0.16.0,<1.0.0)",
    "rich (>=13.0.0,<16.0.0)",
    "tomlkit (>=0.13.0,<1.0.0)",
    "textual (>=8.2.8,<9.0.0)",
]

[project.urls]
Homepage = "https://fancysnake.github.io/tingle/"
Documentation = "https://fancysnake.github.io/tingle/"
Repository = "https://github.com/fancysnake/tingle"
Changelog = "https://github.com/fancysnake/tingle/blob/main/CHANGELOG.md"
Issues = "https://github.com/fancysnake/tingle/issues"

[project.scripts]
tingle = "tingle.inits.cli:run"

[tool.poetry]
packages = [{ include = "tingle", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.12"
mypy = ">=1.16"
import-linter = ">=2.0"
lxml = ">=5.0"
lxml-stubs = ">=0.5"
taplo = "^0.9.3"
black = "^26.5.1"
codespell = "^2.4.2"
pylint = "^4.0.6"

# optional: the test/quality CI jobs do not need the docs toolchain.
# `mise run docs:build` and `docs:serve` install it on demand.
deptry = "^0.25.1"
pip-audit = "^2.10.1"
pytest-xdist = "^3.8.0"
pytest-cov = "^7.1.0"
diff-cover = "^10.4.1"
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
preview = true
skip-magic-trailing-comma = true
target-version = ['py311']

[tool.ruff]
line-length = 88
output-format = 'concise'
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "missing-copyright-notice",
    "docstring-missing-returns",
    "docstring-missing-exception",
    "docstring-missing-yields",
    "suspicious-subprocess-import",
    "undocumented-public-module",
    # conflicts with the ruff formatter and each other; standard exclusions
    "COM812", # trailing commas are the formatter's job
    "D203",   # incompatible with D211 (blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary on first line)
]

[tool.ruff.lint.isort]
# TYPE_CHECKING-only imports appear in annotations; on 3.11-3.13 those
# evaluate eagerly unless every module opts into lazy annotations
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest is built on assert
    "D1",      # test names are the documentation
    "PLR2004", # literal expected values are the point of assertions
    "INP001",  # test directories are not importable packages
    "S603",    # tests drive the real git executable on purpose
    "S607",    # (and rely on it being on PATH)
]
# per-metric isolation: the runners must catch everything a metric raises
"src/tingle/mills/runner.py" = ["BLE001"]
"src/tingle/mills/diff.py" = ["BLE001"]
# CLI flags are inherently boolean and typer requires this parameter shape;
# a command function has one parameter per CLI option by construction;
# textual is imported lazily so non-interactive commands stay fast
"src/tingle/gates/cli/typer.py" = ["FBT001", "FBT002", "PLR0913", "PLC0415"]
# the adapter's whole job is invoking the git executable
"src/tingle/links/git/cli.py" = ["S603", "S607"]
# and this one runs the resolved VS Code `code` executable (no shell, no path search)
"src/tingle/links/editor.py" = ["S603"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-values-type = "tuple"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
check_untyped_defs = true
color_output = true
disallow_any_decorated = true
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = ["migrations/.*.py", "tests/.*.py"]
explicit_package_bases = true
extra_checks = true
implicit_reexport = true
mypy_path = "src"
plugins = []
pretty = true
python_version = "3.11"
strict = true
strict_equality = true
strict_equality_for_none = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
include_external_packages = "True"
root_package = "tingle"

# Explanation <source_modules> can't import <forbidden_modules>

[[tool.importlinter.contracts]]
name = "gates"
type = "forbidden"
source_modules = ["tingle.gates"]
forbidden_modules = [
    "tingle.links",
    "tingle.inits",
    # "tingle.mills",
    # "tingle.specs",
    "tingle.edges",
]

[[tool.importlinter.contracts]]
name = "links"
type = "forbidden"
source_modules = ["tingle.links"]
forbidden_modules = [
    "tingle.gates",
    "tingle.inits",
    "tingle.mills",
    "tingle.specs",
    "tingle.edges",
]

[[tool.importlinter.contracts]]
name = "inits"
type = "forbidden"
source_modules = ["tingle.inits"]
forbidden_modules = [
    # "tingle.specs",
    "tingle.edges",
]


[[tool.importlinter.contracts]]
name = "mills"
type = "forbidden"
source_modules = ["tingle.mills"]
forbidden_modules = ["tingle.gates", "tingle.links", "tingle.inits", "tingle.edges"]


[[tool.importlinter.contracts]]
name = "pacts"
type = "forbidden"
source_modules = ["tingle.pacts"]
forbidden_modules = [
    "tingle.gates",
    "tingle.links",
    "tingle.inits",
    "tingle.mills",
    "tingle.specs",
    "tingle.edges",
]


[[tool.importlinter.contracts]]
name = "specs"
type = "forbidden"
source_modules = ["tingle.specs"]
forbidden_modules = [
    "tingle.gates",
    "tingle.links",
    "tingle.inits",
    "tingle.mills",
    "tingle.edges",
]


[[tool.importlinter.contracts]]
name = "edges"
type = "forbidden"
source_modules = ["tingle.edges"]
forbidden_modules = [
    "tingle.gates",
    "tingle.links",
    "tingle.inits",
    "tingle.mills",
    "tingle.pacts",
    "tingle.specs",
]

