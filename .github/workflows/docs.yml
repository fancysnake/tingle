name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# never cancel an in-flight deploy; queue instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      # Pages serves this site, so the recorded history has no branch of its
      # own to be served from: fetch its chart over the placeholder committed
      # at that path. Before the build, not after, so MkDocs carries it into
      # the site and `--strict` checks the pages that link to it.
      #
      # This workflow and Metrics history both fire on the same push and run
      # concurrently, so the chart published here is normally one commit
      # behind; the next push to main brings it level.
      - uses: ./actions/metrics-history/publish
        with:
          data-branch: metrics-data
          into: docs/history/chart
      - run: mise run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  # only main publishes; pull requests stop at the strict build above
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # scoped to this job: the PR build must not hold Pages write / OIDC
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
