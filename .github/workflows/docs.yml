name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# never cancel an in-flight deploy; queue instead
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - run: mise run docs:build
      # Pages serves this site, so the recorded history has no branch of its
      # own to be served from: fold its chart into the site before upload
      - name: Add the metrics history chart
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          data=$(mktemp -d)
          if git clone --quiet --depth 1 --branch metrics-data "$REPO" "$data"; then
            mkdir -p site/history/chart
            cp -R "$data/metrics/." site/history/chart/
          else
            echo "::notice::no metrics-data branch; the site ships without the chart"
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  # only main publishes; pull requests stop at the strict build above
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # scoped to this job: the PR build must not hold Pages write / OIDC
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
