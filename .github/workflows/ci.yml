name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5
      - run: mise exec -- poetry install
      - run: mise test:py:cov
      - run: mise exec -- poetry run coverage xml
      - name: Upload coverage to Codecov
        # one report per commit is enough; the other legs only prove the
        # suite passes on their interpreter
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python
          disable_search: true

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5
      - run: mise exec -- poetry install
      - run: mise run lint:py
      - run: mise run lint:markdown
      - run: mise run lint:strict
      - run: mise run lint:versions

  # its own job, so a newly published advisory reads as that, not as a lint
  # failure; it scans lockfiles only, so it needs no `poetry install`
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5
        with:
          install_args: trivy
      - run: mise run lint:trivy
        env:
          # `mise run` installs every tool in mise.toml before a task by
          # default, which would undo `install_args`
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # advisory: tingle has false positives, so it reports without blocking the merge
  tingle:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write # the sticky delta comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tingle check needs history to find the merge-base
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5
      - run: mise exec -- poetry install
      # judge with the build under review, not the released wheel
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: ./actions/pr-feedback
