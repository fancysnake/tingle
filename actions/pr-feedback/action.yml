name: tingle pr feedback
description: >-
  Run `tingle check` and report it on the pull request: an annotation on each
  line the branch added debt on, and one comment holding the per-metric delta
  that every run edits in place. Expects `tingle` on PATH and a checkout with
  history (`fetch-depth: 0`).

inputs:
  config:
    description: Path to the config file, when it is not auto-discovered.
    default: ""
  policy:
    description: Override the configured `[check]` policy, `sum` or `any`.
    default: ""
  comment:
    description: Post the sticky comment. `false` keeps the annotations only.
    default: "true"
  key:
    description: >-
      Names the comment this run owns. Give each config its own when a pull
      request runs several; empty means the config path.
    default: ""
  github-token:
    description: Token used to read and write the pull request's comments.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check
      id: check
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        POLICY: ${{ inputs.policy }}
      run: |
        # 1 is a verdict (or a metric that raised, named on stderr) and still
        # writes the payload; above that there is nothing to report
        status=0
        tingle check --json ${POLICY:+--policy "$POLICY"} ${CONFIG:+--config "$CONFIG"} \
          > "$RUNNER_TEMP/tingle-check.json" || status=$?
        [ "$status" -le 1 ] || exit "$status"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Annotate
      shell: bash
      env:
        JQ: ${{ github.action_path }}/annotations.jq
      run: |
        result="$RUNNER_TEMP/tingle-check.json"
        prefix=$(realpath --relative-to="$GITHUB_WORKSPACE" "$(jq -r .root "$result")")
        jq -r --arg prefix "$prefix" -f "$JQ" "$result"

    - name: Comment
      if: inputs.comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        JQ: ${{ github.action_path }}/comment.jq
        KEY: ${{ inputs.key || inputs.config || 'default' }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        marker="<!-- tingle-pr-feedback: $KEY -->"
        body="$RUNNER_TEMP/tingle-comment.md"
        jq -r --arg marker "$marker" -f "$JQ" "$RUNNER_TEMP/tingle-check.json" > "$body"
        comments="repos/$GITHUB_REPOSITORY/issues"
        existing=$(gh api --paginate "$comments/$PR/comments" \
          | jq -r --arg marker "$marker" '.[] | select(.body | startswith($marker)) | .id' \
          | head -n 1)
        # a pull request from a fork gets a read-only token: the annotations
        # still land, so the comment failing must not fail the step
        if [ -n "$existing" ]; then
          gh api -X PATCH "$comments/comments/$existing" -F body=@"$body" > /dev/null
        else
          gh api "$comments/$PR/comments" -F body=@"$body" > /dev/null
        fi || echo "::warning::could not post the tingle comment; a pull request from a fork has a read-only token"

    - name: Verdict
      shell: bash
      run: exit ${{ steps.check.outputs.status }}
