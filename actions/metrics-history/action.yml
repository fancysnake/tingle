name: tingle metrics history
description: >-
  Record `tingle stat` on a branch and publish its history as one chart per
  metric group. Expects `tingle` on PATH — run it from the job that already
  installed it.

inputs:
  name:
    description: Chart title. Keep it stable — it keys the stored series.
    default: tingle
  config:
    description: Path to the config file, when it is not auto-discovered.
    default: ""
  data-branch:
    description: Branch the history is committed to. Created when missing.
    default: gh-pages
  data-dir:
    description: Directory in that branch holding the chart and its data.
    default: metrics
  max-points:
    description: Points kept per metric. Empty keeps every build.
    default: ""
  github-token:
    description: Token used to create and push to the data branch.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Require a clean checkout
      shell: bash
      run: |
        # recording switches this checkout to the data branch and back, and
        # git refuses to switch away from a modified tracked file — say so
        # here rather than letting it surface as a raw git error later
        if ! git diff --quiet HEAD; then
          echo "::error::the checkout has modified tracked files; commit or discard them before recording"
          git diff --name-only HEAD >&2
          exit 1
        fi

    - name: Measure
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        # `stat` exits 1 when a metric raises, having named it on stderr and
        # written the rest of the payload: one broken metric must not cost
        # the whole data point. Anything above that is the tool failing.
        status=0
        tingle stat --json ${CONFIG:+--config "$CONFIG"} > stat.json || status=$?
        [ "$status" -le 1 ] || exit "$status"
        # `extra` is the benchmark format's free field; the chart page reads
        # the group out of it to know which chart a metric belongs on. An
        # ungrouped metric leaves the key out rather than setting it null:
        # the recorder validates `extra` with a coercing string schema, so a
        # null arrives at the page as the string "null" and reads as a group
        # by that name. Absent, it reaches the page as undefined, and the
        # page's own fallback is the single place that names the loose group.
        jq '[.metrics[] | select(.error == null)
             | {name, unit: "count", value}
               + (if .group then {extra: .group} else {} end)]' \
          stat.json > points.json
        if [ "$(jq length points.json)" -eq 0 ]; then
          echo "::error::every metric errored; there is nothing to record"
          exit 1
        fi

    - name: Prepare the data branch
      shell: bash
      env:
        BRANCH: ${{ inputs.data-branch }}
        DATA_DIR: ${{ inputs.data-dir }}
        TOKEN: ${{ inputs.github-token }}
        CHART: ${{ github.action_path }}/chart/index.html
      run: |
        # Two things the benchmark step needs settled before it runs. It
        # fetches this branch and dies on a raw git error if it is absent —
        # which is every repository's first run. And it writes its own page,
        # one chart per metric, when the data directory holds none: putting
        # tingle's page there first means it finds one and leaves it alone,
        # so the branch is never published holding the wrong chart.
        #
        # In a scratch repository throughout: the data branch shares no
        # history with the source, and the caller's checkout is untouched.
        remote="https://x-access-token:$TOKEN@${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY.git"
        author=(-c 'user.name=github-actions[bot]'
                -c 'user.email=41898282+github-actions[bot]@users.noreply.github.com')
        for attempt in 1 2 3; do
          work=$(mktemp -d)
          # `ls-remote --exit-code` says 2 for "no such ref"; anything else
          # is the remote being broken rather than empty — a network blip, a
          # rate limit, a revoked token — and must fail here
          status=0
          git ls-remote --exit-code --heads "$remote" "$BRANCH" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git clone --quiet --depth 1 --branch "$BRANCH" "$remote" "$work"
          elif [ "$status" -eq 2 ]; then
            echo "creating $BRANCH: history has to live somewhere"
            git init --quiet --initial-branch "$BRANCH" "$work"
          else
            exit "$status"
          fi
          mkdir -p "$work/$DATA_DIR"
          cp "$CHART" "$work/$DATA_DIR/index.html"
          git -C "$work" add "$DATA_DIR/index.html"
          # the page only changes when tingle does, so most runs stop here
          if git -C "$work" diff --cached --quiet; then
            exit 0
          fi
          git -C "$work" "${author[@]}" commit --quiet -m "Publish the tingle metrics chart"
          git -C "$work" push --quiet "$remote" "$BRANCH" && exit 0
          # git has already said why on stderr — `--quiet` drops the ref
          # listing, not errors. Retrying only helps when the branch moved
          # under the push, and the next attempt re-reads it to find out.
          echo "pushing to $BRANCH failed on attempt $attempt; retrying"
        done
        echo "::error::could not publish the chart page to $BRANCH"
        exit 1

    - uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      with:
        name: ${{ inputs.name }}
        # every tingle metric is a count you want to shrink or hold
        tool: customSmallerIsBetter
        output-file-path: points.json
        github-token: ${{ inputs.github-token }}
        auto-push: true
        gh-pages-branch: ${{ inputs.data-branch }}
        benchmark-data-dir-path: ${{ inputs.data-dir }}
        max-items-in-chart: ${{ inputs.max-points }}
        # `tingle check` is the gate; this action only records
        comment-on-alert: false
        fail-on-alert: false
