[display]
loc_range = "python"

[ranges.python]
include = ["src/**/*.py", "tests/**/*.py"]
# The template pack states the patterns these metrics search for, so
# measuring it measures the ruler: every `# noqa:` in it is a definition.
exclude = ["src/tingle/builtins/**"]
default = true

[ranges.config]
include = ["pyproject.toml", "mise.toml", ".pylintrc"]

# A branch may take on debt in one metric if it pays off as much elsewhere.
[check]
policy = "sum"

# Formatting

[[metrics]]
base = "tingle.builtins.black.fmt_comment"

[[metrics]]
base = "tingle.builtins.taplo.ignore_comment"

[[metrics]]
base = "tingle.builtins.codespell.ignore_comment"

[[metrics]]
base = "tingle.builtins.ruff.format_excludes"

[[metrics]]
base = "tingle.builtins.ruff.noqa_comment"
# `_source(...)` writes sample code for a test to measure; the markers in
# it are the subject, not something silenced.
extra_ignore_lines = ['_source\(']

[[metrics]]
base = "tingle.builtins.ruff.lint_ignores"

[[metrics]]
base = "tingle.builtins.ruff.per_file_ignores"

[[metrics]]
base = "tingle.builtins.pylint.disable_comment"

[[metrics]]
base = "tingle.builtins.pylint.rcfile_disables"

# typing

[[metrics]]
base = "tingle.builtins.mypy.type_ignore_comment"

[[metrics]]
base = "tingle.builtins.mypy.type_ignore_spread"

[[metrics]]
base = "tingle.builtins.mypy.overrides"

# architecture

[[metrics]]
base = "tingle.builtins.import_linter.deferred_contracts"
range = "config"

[[metrics]]
base = "tingle.builtins.python.long_files"

[[metrics]]
base = "tingle.builtins.unittest_mock.any_used"
name = "any-uses"
group = "typing"
description = "`ANY` placeholders, excluding the CheckPolicy.ANY enum."
ignore_lines = ['CheckPolicy.ANY']
