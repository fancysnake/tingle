[settings]
experimental = true

[hooks]
enter = "poetry install"

[tools]
pipx = "1.16.7"
"pipx:poetry" = "2.4.1"
python = "3.14.6"

[env]
_.python.venv = { path = ".venv", create = true }
# integration tests chdir into tmpdirs, so coverage must be told an absolute
# destination or the data file is written into a directory that then vanishes
COVERAGE_FILE = "{{ config_root }}/.coverage.unit"
PACKAGE = "tingle"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
TOML_PATHS = ".taplo.toml pyproject.toml mise.toml tingle.toml"

[task_config]
includes = ["git::https://github.com/fancysnake/shared-configs.git//python.toml"]

# the docs group is optional, so the `enter` hook's plain `poetry install`
# does not provide mkdocs; every docs task pulls it in first.
[tasks."docs:_install"]
hide = true
run = "poetry install --with docs"

[tasks."docs:serve"]
depends = ["docs:_install"]
description = "Serve the documentation site locally with live reload"
run = "poetry run mkdocs serve"

[tasks."docs:build"]
depends = ["docs:_install"]
description = "Build the documentation site (fails on broken links)"
run = "poetry run mkdocs build --strict"

# Two checks the shared lint:py cannot express, because an included task
# cannot be overridden by name: it runs mypy on source only, and it runs
# pylint over src and tests in one pass, which forces duplicate-code off
# repo-wide. Both are re-applied here at the scope where they mean something.
[tasks."lint:strict"]
description = "Type-check the tests, and hold source to duplicate-code"
run = [
    "mypy {{ env.TEST_PATHS }}",
    "pylint -j 0 --enable=duplicate-code {{ env.SRC_PATHS }} {{ env.SCRIPT_PATHS }}",
]

# check:py plus the gates CI cares about: the scoped checks above, coverage
# of the lines this branch changed, and tingle's own debt report
[tasks.fullcheck]
description = "Run every check: formatters, linters, diff coverage, tingle"
run = [
    { task = "format:py" },
    { task = "lint:py" },
    { task = "lint:strict" },
    { task = "test:py:cov:diff" },
    { task = "lint:tingle" },
]
