[settings]
experimental = true

[hooks]
enter = "poetry install"

[tools]
# `jq` is what `release:bump` edits the plugin manifest with.
jq = "1.8.2"
markdownlint-cli2 = "0.23.3"
node = "26.10.0"
pipx = "1.17.6"
"pipx:poetry" = "2.5.1"
python = "3.11"

[env]
_.python.venv = { path = ".venv", create = true }
# the shared task file reads .env.test itself, but only for its test and
# type-check tasks; loading it here as well is what gives the lint and format
# tasks the same SRC_PATHS/TEST_PATHS/SCRIPT_PATHS/TOML_PATHS.
_.file = ".env.test"
# integration tests chdir into tmpdirs, so coverage must be told an absolute
# destination or the data file is written into a directory that then vanishes
COVERAGE_FILE = "{{ config_root }}/.coverage.unit"
PACKAGE = "tingle"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
# both globs, because a shell one does not match a leading dot and .vekna.toml
# and .taplo.toml are held to the same column width as the rest
TOML_PATHS = "*.toml .*.toml"

[task_config]
includes = ["git::https://github.com/fancysnake/shared-configs.git//python.toml"]

[tasks.update]
run = [
    "mise upgrade --bump --exclude python --minimum-release-age=7d",
    "mise install",
    { task = "dep:upgrade:py" },
]

# split the way the shared config splits black, ruff and taplo: the checking
# half is what a gate may run, since the fixing half rewrites the files
[tasks."lint:markdown"]
description = "Check Markdown with markdownlint"
run = "markdownlint-cli2 docs/**/*.md plugins/**/*.md CHANGELOG.md CLAUDE.md README.md"

[tasks."format:markdown"]
description = "Format Markdown with markdownlint"
run = "markdownlint-cli2 --fix docs/**/*.md plugins/**/*.md CHANGELOG.md CLAUDE.md README.md"

# `--only docs --no-root` because mkdocs.yml declares no plugins: nothing here
# imports the package, so neither the package nor the dev group is worth
# installing. `--only` alone still installs the root project.
[tasks."site:_install"]
hide = true
run = "poetry install --only docs --no-root --quiet"

[tasks."site:dev"]
description = "Serve the documentation site with live reload"
run = [{ task = "site:_install" }, "mkdocs serve"]

[tasks."site:build"]
description = "Build the documentation site into site/"
run = [{ task = "site:_install" }, "mkdocs build"]

# The plugin carries the package version, so a bump is two files that must
# agree. `poetry version` is what validates the string; the manifest follows it.
[tasks."release:bump"]
description = "Set the package version in pyproject.toml and the plugin manifest"
usage = 'arg "<version>"'
run = """
set -eu
poetry version "$usage_version"
manifest=plugins/tingle-config/.claude-plugin/plugin.json
jq --arg v "$(poetry version -s)" '.version = $v' "$manifest" > "$manifest.tmp"
mv "$manifest.tmp" "$manifest"
git --no-pager diff --stat -- pyproject.toml "$manifest"
"""

# Two checks the shared lint:py cannot express, because an included task
# cannot be overridden by name: it runs mypy on source only, and it runs
# pylint over src and tests in one pass, which forces duplicate-code off
# repo-wide. Both are re-applied here at the scope where they mean something.
[tasks."lint:strict"]
description = "Type-check the tests, and hold source to duplicate-code"
run = [
    "mypy {{ env.TEST_PATHS }}",
    "pylint -j 0 --enable=duplicate-code {{ env.SRC_PATHS }} {{ env.SCRIPT_PATHS }}",
]

# what the `quality` job in ci.yml runs, in the same order
[tasks."lint:all"]
description = "Run every linter: Python, Markdown, and the scoped checks"
run = [{ task = "lint:py" }, { task = "lint:markdown" }, { task = "lint:strict" }]

# what an unattended `vekna cast` may run: it changes no file, so the ritual's
# `git add -A` cannot sweep up a repo-wide reformat, and it measures no
# coverage, because cabinet's own `coverage` key owns that and a gap found
# there reaches the agent as a coverage report rather than a red gate.
[tasks.gate]
description = "Linters, types and the test suite, changing nothing"
run = [{ task = "lint:all" }, { task = "lint:versions" }, { task = "test:py" }]

# the gate a human commits behind: the formatters as well, the strict docs
# build, coverage of the lines this branch changed, and — in `fullcheck`
# alone, since CI has it continue-on-error — tingle's own debt report.
# `gate` stays without these: it is the unattended-cast task and wants to
# stay fast and write nothing.
[tasks.check]
description = "Run every check but tingle's own debt report"
run = [
    { task = "format:py" },
    { task = "format:markdown" },
    { task = "lint:all" },
    { task = "lint:versions" },
    { task = "site:build" },
    { task = "test:py:cov:diff" },
]

[tasks.fullcheck]
description = "Run every check: formatters, linters, docs, diff coverage, tingle"
run = [{ task = "check" }, { task = "lint:tingle" }]

# The plugin manifest carries the package version (see release:bump), so the
# two files can drift. Checked here, on the branch, rather than only against
# the tag — this repo tags after merge, and a mismatch there costs a deleted
# tag. mise puts the pinned jq on PATH; the release workflow's bare one was
# the runner image's.
[tasks."lint:versions"]
description = "Check the plugin manifest declares the package version"
run = """
set -eu
manifest=plugins/tingle-config/.claude-plugin/plugin.json
declared=$(poetry version -s)
plugin=$(jq -r .version "$manifest")
if [ "$plugin" != "$declared" ]; then
    echo "$manifest declares version $plugin, pyproject declares $declared" >&2
    exit 1
fi
"""
